name: profeapp

services:
  db:
    image: postgres:15
    container_name: profeapp-db
    environment:
      POSTGRES_DB: profeapp
      POSTGRES_USER: profeapp
      POSTGRES_PASSWORD: profeapp
      TZ: America/Tegucigalpa
    ports:
      # 5435 lo usa stock-ruta: así las dos bases conviven en la misma máquina.
      - "5436:5432"
    volumes:
      - profeapp-db:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profeapp -d profeapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  profeapp-db:
