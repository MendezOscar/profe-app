# Blueprint de Render para la API. Ver docs/despliegue.md.
# Los valores con sync: false se cargan a mano en el panel (son secretos).
services:
  - type: web
    name: profeapp
    runtime: docker
    # Rutas desde la raíz del repo. El contexto es backend/ porque el Dockerfile copia
    # Directory.Build.props y los .csproj con rutas relativas a esa carpeta.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Sólo redesplegar cuando cambia el backend, no con cada cambio de la app.
    buildFilter:
      paths:
        - backend/**
    region: virginia
    plan: free
    # /health/live no toca la base: un tropiezo de la base no debe hacer que Render
    # reinicie la API, que igual responde (la app reintenta la sincronización sola).
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: App__TimeZone
        value: America/Tegucigalpa
      - key: App__ApplyMigrationsOnStartup
        value: "true"
      - key: App__CorsOrigins__0
        value: https://profeapp.pages.dev
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        sync: false
