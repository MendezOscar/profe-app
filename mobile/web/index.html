<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Lo reemplaza el valor de --base-href al compilar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Planifique, califique y exporte a SACE.">
  <meta name="theme-color" content="#2B59C3">

  <!-- Vista previa al compartir el enlace -->
  <meta property="og:title" content="ProfeApp">
  <meta property="og:description" content="Planifique, califique y exporte a SACE.">
  <meta property="og:image" content="og-image.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ProfeApp">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <title>ProfeApp</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Mientras Flutter carga: el símbolo de la marca sobre el fondo de la app. */
    body { margin: 0; background: #F5F7FB; }
    #arranque { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="arranque" aria-label="Cargando ProfeApp">
    <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" fill="#2B59C3"/>
      <path d="M17 33 L27 43 L47 23" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter"/>
    </svg>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('arranque')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
